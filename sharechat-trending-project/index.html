<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B35">
    <title>ShareChat - ट्रेंडिंग टैग्स</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --success: #10B981;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            color: white;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .page-title {
            color: rgba(255,255,255,0.9);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-bar {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        .search-bar input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .category-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(255,107,53,0.3);
        }

        .hero-trend {
            margin: 16px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8F5C 50%, #FFB088 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
        }

        .hero-trend::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.25);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .hero-tag {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 14px;
            opacity: 0.95;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .hero-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .hero-heat {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 32px;
        }

        .trends-section {
            padding: 0 16px 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--success);
            font-weight: 600;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .trend-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .trend-card:active {
            transform: scale(0.98);
        }

        .trend-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--card-color, var(--primary));
            border-radius: 16px 0 0 16px;
        }

        .trend-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .trend-rank-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .trend-rank {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-secondary);
            opacity: 0.4;
            line-height: 1;
            min-width: 36px;
        }

        .trend-rank.top3 {
            color: var(--primary);
            opacity: 1;
        }

        .trend-info {
            flex: 1;
        }

        .trend-tag {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-category {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .trend-heat {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .heat-score {
            font-size: 20px;
            font-weight: 800;
            color: var(--card-color, var(--primary));
        }

        .heat-label {
            font-size: 11px;
            font-weight: 600;
        }

        .trend-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
            padding-left: 48px;
        }

        .trend-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 48px;
        }

        .trend-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .trend-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend-source-pills {
            display: flex;
            gap: 4px;
        }

        .source-pill {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
        }

        .source-pill.active {
            background: var(--primary);
        }

        .detail-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 200;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        .detail-view.active {
            display: block;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .detail-header {
            background: linear-gradient(135deg, var(--detail-color, var(--primary)) 0%, var(--detail-color-dark, var(--primary-dark)) 100%);
            padding: 60px 20px 30px;
            color: white;
            position: relative;
        }

        .detail-back {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .detail-heat-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .detail-tag {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail-desc {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .detail-stats-bar {
            display: flex;
            gap: 20px;
        }

        .detail-stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .detail-stat-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .detail-content {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .signal-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .signal-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .signal-label {
            font-size: 13px;
            font-weight: 500;
            min-width: 80px;
            color: var(--text-secondary);
        }

        .signal-track {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .signal-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        .signal-value {
            font-size: 13px;
            font-weight: 600;
            min-width: 30px;
            text-align: right;
        }

        .post-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .post-author-info {
            flex: 1;
        }

        .post-author {
            font-size: 14px;
            font-weight: 600;
        }

        .post-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .post-text {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .post-actions {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-action {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ai-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 16px;
            color: white;
            margin-bottom: 16px;
        }

        .ai-summary-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .ai-summary-text {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 4px 16px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 22px;
        }

        .refresh-indicator {
            text-align: center;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 13px;
            display: none;
        }

        .refresh-indicator.visible {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 16px;
            font-weight: 500;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg) 25%, #e8e8e8 50%, var(--bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            height: 120px;
        }

        @media (max-width: 430px) {
            .app-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="mainFeed">

                            <div class="heat-score" style="color: ${trend.color}">${trend.heat_score}</div>
                            <div class="heat-label">${trend.heat_label}</div>
                        </div>
                    </div>
                    <div class="trend-desc">${trend.short_desc}</div>
                    <div class="trend-footer">
                        <div class="trend-meta">
                            <span>&#128172; ${trend.formatted_engagement}</span>
                            <span>&#128344; ${trend.time_ago}</span>
                        </div>
                        <div class="trend-source-pills">
                            ${trend.sources.map(s => '<div class="source-pill active"></div>').join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openDetail(tag) {
            const trend = trendsData.find(t => t.tag === tag);
            if (!trend) return;
            currentTrend = trend;

            document.getElementById('detailTag').textContent = trend.hindi_tag;
            document.getElementById('detailDesc').textContent = trend.description;
            document.getElementById('detailHeat').textContent = trend.heat_score;
            document.getElementById('detailHeatIcon').textContent = trend.heat_label;
            document.getElementById('detailPosts').textContent = (trend.related_posts / 1000).toFixed(0) + 'K';
            document.getElementById('detailEngagement').textContent = trend.formatted_engagement;

            const header = document.getElementById('detailHeader');
            header.style.background = `linear-gradient(135deg, ${trend.color} 0%, ${trend.color}dd 100%)`;

            const summaries = {
                'राजनीति': `यह ट्रेंड भारतीय राजनीति में एक महत्वपूर्ण घटना को दर्शाता है। सोशल मीडिया पर इस पर intense बहस चल रही है। ${trend.engagement.views > 3000000 ? 'यह आज का सबसे viral political topic है।' : 'यह अपनी category में top trending में से एक है।'}`,
                'खेल': `स्पोर्ट्स fans इस topic को लेकर काफी excited हैं। ${trend.engagement.shares > 400000 ? 'इसे काफी share किया जा रहा है, जो इसकी popularity दर्शाता है।' : 'Live updates के साथ यह trend grow हो रहा है।'}`,
                'मनोरंजन': `Entertainment enthusiasts इस content को binge-watch कर रहे हैं। ${trend.engagement.comments > 200000 ? 'Comments section में active discussion चल रही है।' : 'OTT platforms पर यह top trending में है।'}`,
                'त्योहार': `यह सांस्कृतिक/धार्मिक event भारत भर में celebrate हो रहा है। ${trend.engagement.shares > 400000 ? 'लोग अपने experiences share कर रहे हैं।' : 'Traditional और modern दोनों तरह से celebrations देखे जा रहे हैं।'}`,
                'समाचार': `यह breaking news story भारत में काफी discussed हो रही है। ${trend.engagement.comments > 300000 ? 'Public opinion divided है, जैसा comments से पता चलता है।' : 'News channels और social media दोनों पर active coverage है।'}`
            };
            document.getElementById('aiSummaryText').textContent = summaries[trend.category] || summaries['समाचार'];

            const signalColors = {'news': '#EF4444', 'social': '#3B82F6', 'search': '#10B981', 'entertainment': '#8B5CF6', 'cultural': '#F59E0B'};
            const signalNames = {'news': 'समाचार', 'social': 'सोशल मीडिया', 'search': 'सर्च वॉल्यूम', 'entertainment': 'मनोरंजन', 'cultural': 'सांस्कृतिक'};

            document.getElementById('signalBars').innerHTML = Object.entries(trend.source_breakdown)
                .filter(([_, val]) => val > 0)
                .map(([key, val]) => `
                    <div class="signal-bar">
                        <div class="signal-label">${signalNames[key] || key}</div>
                        <div class="signal-track"><div class="signal-fill" style="width: ${val}%; background: ${signalColors[key] || '#999'}"></div></div>
                        <div class="signal-value">${val}%</div>
                    </div>
                `).join('');

            document.getElementById('relatedPosts').innerHTML = trend.related_content.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">${post.avatar}</div>
                        <div class="post-author-info">
                            <div class="post-author">${post.author}</div>
                            <div class="post-time">${post.time} ago</div>
                        </div>
                    </div>
                    <div class="post-text">${post.text}</div>
                    <div class="post-actions">
                        <div class="post-action">&#10084;&#65039; ${(post.likes / 1000).toFixed(1)}K</div>
                        <div class="post-action">&#128260; ${(post.shares / 1000).toFixed(1)}K</div>
                        <div class="post-action">&#128172; ${(post.shares / 2000).toFixed(1)}K</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('detailView').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detailView').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('categoryScroll').addEventListener('click', (e) => {
            const pill = e.target.closest('.category-pill');
            if (!pill) return;
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentCategory = pill.dataset.category;
            filterTrends();
        });

        function filterTrends() {
            let filtered = trendsData;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(t => t.category === currentCategory);
            }
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(t => 
                    t.hindi_tag.toLowerCase().includes(searchTerm) ||
                    t.description.toLowerCase().includes(searchTerm)
                );
            }
            filtered = filtered.map((t, i) => ({...t, rank: i + 1}));
            renderTrends(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterTrends);

        function loadTrends() {
            const indicator = document.getElementById('refreshIndicator');
            indicator.classList.add('visible');

            setTimeout(() => {
                trendsData = mockTrends;
                indicator.classList.remove('visible');
                renderTrends(trendsData);
            }, 800);
        }

        loadTrends();

        let touchStartY = 0;
        const mainFeed = document.getElementById('mainFeed');
        mainFeed.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        mainFeed.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            if (touchEndY - touchStartY > 100 && mainFeed.scrollTop === 0) loadTrends();
        }, { passive: true });
    </script>
</body>
</html>
